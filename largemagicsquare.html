<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔方陣を組み合わせる - 1</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#243641;background:#f5f7f6;--a:#c5e6fb;--b:#ffe3ad;--both:#bde5cb}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:36px 20px 64px}header{margin-bottom:28px}.eyebrow{color:#287364;font-size:13px;font-weight:700;letter-spacing:.12em}h1{font-size:clamp(24px,4vw,36px);margin:10px 0}h2{font-size:21px;margin:0}p{line-height:1.8}.muted{color:#62737a;font-size:14px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #dce4e0;border-radius:16px;padding:22px;min-width:0;box-shadow:0 3px 12px #1b3d2b04}.cardhead,.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}.badge{font-size:13px;color:#526861}button,select,input,textarea{font:inherit}button,select{border:1px solid #c5d2cc;border-radius:8px;background:white;color:#243641;padding:9px 13px}button{cursor:pointer}button:hover{background:#eef4f1}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #347fa5;outline-offset:2px}.primary{background:#236b57;color:white;border:0;padding:13px 32px;font-weight:700}.primary:hover{background:#19513f}.generate{text-align:center;margin:24px 0}.scroll{overflow:auto;margin-top:18px;padding:3px 3px 10px}table{border-collapse:collapse;margin:auto;font-variant-numeric:tabular-nums}td{padding:0;border:1px solid #c8d2ce;text-align:center;background:white}td button{display:block;border:0;border-radius:0;padding:0;width:var(--cell,48px);height:var(--cell,48px);font-size:var(--font,16px);background:transparent;color:inherit}td button:hover{background:#edf3f0}td input{width:var(--cell,48px);height:var(--cell,48px);text-align:center;border:0;border-radius:0;background:transparent;padding:0;font-size:var(--font,16px);color:inherit}td.selA{background:var(--a)}td.selB{background:var(--b)}td.both{background:var(--both);box-shadow:inset 0 0 0 3px #34734e}td.selA button:hover,td.selB button:hover,td.both button:hover{background:transparent}td.bt{border-top:3px solid #63796e}td.bl{border-left:3px solid #63796e}td.bb{border-bottom:3px solid #63796e}td.br{border-right:3px solid #63796e}.sum{border:0;background:transparent;color:#677971;font-size:12px;padding:8px;white-space:nowrap}.status{font-size:13px;line-height:1.7;margin:12px 0 0;color:#27644a}.status.bad{color:#ad3c37}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 0}.controls label{font-size:14px}.controls input{accent-color:#236b57}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:18px 0}.legend span::before{content:"";display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--a)}.legend span:nth-child(2)::before{background:var(--b)}.legend span:nth-child(3)::before{background:var(--both)}.calculation{white-space:pre-line;background:#f0f5f2;border-radius:10px;padding:14px 18px;min-height:54px;line-height:1.7;font-variant-numeric:tabular-nums}details{margin-top:15px}summary{cursor:pointer;color:#51685c;font-size:14px}textarea{width:100%;min-height:100px;margin-top:12px;border:1px solid #c5d2cc;border-radius:8px;padding:10px;resize:vertical}.result[hidden]{display:none}#message{color:#ad3c37;text-align:center;font-size:14px}footer{margin-top:20px;font-size:12px;color:#738078}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){main{padding:24px 12px 40px}.inputs{grid-template-columns:1fr}.card{padding:16px}.sum{padding:5px}}
.base-toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer}.base-toggle input{position:absolute;opacity:0;width:1px;height:1px}.switch-track{position:relative;display:inline-block;width:46px;height:26px;border-radius:20px;background:#708078;transition:background .18s}.switch-track::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:white;border-radius:50%;box-shadow:0 1px 3px #0003;transition:transform .18s}.base-toggle input:checked+.switch-track{background:#236b57}.base-toggle input:checked+.switch-track::after{transform:translateX(20px)}.base-toggle input:focus-visible+.switch-track{outline:3px solid #347fa5;outline-offset:3px}
</style></head><body><main>
<header><h1>魔方陣を組み合わせる - 1</h1></header>
<div class="inputs" id="inputs"></div><div class="generate"><button class="primary" id="generate">組み合わせる ↓</button><div id="message" role="alert"></div></div>
<section class="card result" id="result" hidden><div class="cardhead"><h2>魔方陣 C <span class="badge" id="resultSize"></span></h2><button id="clear">選択を解除</button></div>
<div class="legend"><span>Aの選択位置</span><span>Bの選択ブロック</span><span>両方が重なるマス</span></div>
<div class="calculation" id="calculation" aria-live="polite">A・B・Cのマスを選択してください。</div>
<div class="controls"><label><input type="checkbox" id="showSums" checked> 行・列の和を表示</label><label>表示サイズ <input id="zoom" type="range" min="28" max="72" value="44"></label><button id="copy">数字をコピー</button><button id="csv">CSVをダウンロード</button></div>
<div class="scroll" id="output"></div><p class="status" id="resultStatus"></p><div class="muted" id="exportStatus" role="status"></div></section>
<footer>ブロック合成法 · 入力した内容は、このブラウザ内で処理されます。</footer>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const initial=[[8,1,6],[3,5,7],[4,9,2]];
const models={A:initial.map(r=>r.slice()),B:initial.map(r=>r.slice())};
let bZero=true;
function shown(k,v){return v===null?null:v-(k==='B'&&bZero?1:0)}
function stored(k,v){return v===null?null:v+(k==='B'&&bZero?1:0)}
let selectedA=null,selectedB=null,C=null,snapshot=null,editing={A:false,B:false};
function sample(n){if(n===1)return [[1]];if(n===2)return Array.from({length:2},()=>[null,null]);if(n===6)return [[1,2,3,34,35,36],[31,32,33,4,5,6],[22,14,24,16,17,18],[15,23,13,21,20,19],[30,29,28,9,8,7],[12,11,10,27,26,25]];if(n===4)return [[16,2,3,13],[5,11,10,8],[9,7,6,12],[4,14,15,1]];if(n%2){const a=Array.from({length:n},()=>Array(n).fill(0));let r=0,c=n>>1;for(let v=1;v<=n*n;v++){a[r][c]=v;let rr=(r+n-1)%n,cc=(c+1)%n;if(a[rr][cc])r=(r+1)%n;else{r=rr;c=cc}}return a}return Array.from({length:n},()=>Array(n).fill(null))}
function check(a){const n=a.length,flat=a.flat(),target=n*(n*n+1)/2;const valid=flat.every(v=>Number.isSafeInteger(v)&&v>=1&&v<=n*n)&&new Set(flat).size===n*n;const rows=a.map(r=>r.reduce((s,v)=>s+v,0)),cols=a.map((_,j)=>a.reduce((s,r)=>s+r[j],0));const diag=[a.reduce((s,r,i)=>s+r[i],0),a.reduce((s,r,i)=>s+r[n-1-i],0)];return {ok:valid&&[...rows,...cols,...diag].every(v=>v===target),valid,target,rows,cols,diag}}
function updateStatus(k){const t=check(models[k]),n=models[k].length,zero=k==='B'&&bZero;$(k+'status').textContent=t.ok?`✓ 魔方陣です · 縦・横・斜めの和 ${t.target-(zero?n:0)}`:t.valid?'縦・横・斜めの和がそろっていません。':`${zero?0:1}〜${n*n-(zero?1:0)} の整数を、1回ずつ入力してください。`;$(k+'status').className='status'+(t.ok?'':' bad')}

function renderInput(k){const n=models[k].length;$(k+'table').innerHTML='';const table=document.createElement('table');table.setAttribute('aria-label','魔方陣'+k);table.style.setProperty('--cell',n>6?'36px':'48px');models[k].forEach((row,i)=>{const tr=table.insertRow();row.forEach((raw,j)=>{const v=shown(k,raw);const td=tr.insertCell();td.dataset.i=i;td.dataset.j=j;const el=document.createElement(editing[k]?'input':'button');el.setAttribute('aria-label',`${k} ${i+1}行${j+1}列${editing[k]?'':': '+(v??'空欄')}`);if(editing[k]){el.type='text';el.inputMode='numeric';el.value=v??'';el.addEventListener('input',()=>{models[k][i][j]=stored(k,el.value.trim()===''?null:Number(el.value));invalidate();updateStatus(k)})}else{el.textContent=v??'—';el.onclick=()=>{if(k==='A')selectedA=equal(selectedA,[i,j])?null:[i,j];else selectedB=equal(selectedB,[i,j])?null:[i,j];highlight()}}td.append(el)})});$(k+'table').append(table);$(k+'edit').textContent=editing[k]?'編集を完了':'数字を編集';updateStatus(k);highlight()}
function invalidate(){C=null;snapshot=null;selectedA=null;selectedB=null;$('result').hidden=true}
function equal(a,b){return !!a&&!!b&&a[0]===b[0]&&a[1]===b[1]}
for(const k of ['A','B']){const card=document.createElement('section');card.className='card';card.innerHTML=`<div class="cardhead"><h2>魔方陣 ${k}</h2><label class="badge">次数 <select id="${k}size" aria-label="魔方陣${k}の次数">${Array.from({length:12},(_,i)=>i+1).filter(n=>n!==2).map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="controls"><button id="${k}edit">数字を編集</button><button id="${k}sample">例を入れる</button></div>${k==='B'?'<div class="controls"><label class="base-toggle"><span>1始まり</span><input type="checkbox" role="switch" aria-label="Bを0始まりにする" id="Bzero" checked><span class="switch-track" aria-hidden="true"></span><span>0始まり</span></label></div>':''}<div class="scroll" id="${k}table"></div><p id="${k}status" class="status"></p><details><summary>数字を貼り付ける</summary><textarea id="${k}paste" aria-label="魔方陣${k}の貼り付け" placeholder="${k==='B'&&bZero?'7 0 5&#10;2 4 6&#10;3 8 1':'8 1 6&#10;3 5 7&#10;4 9 2'}"></textarea><button id="${k}apply">貼り付けを反映</button><p id="${k}error" class="status bad" role="alert"></p></details>`;$('inputs').append(card);$(k+'size').onchange=()=>{const n=Number($(k+'size').value);models[k]=sample(n);invalidate();renderInput(k)};$(k+'edit').onclick=()=>{editing[k]=!editing[k];renderInput(k)};$(k+'sample').onclick=()=>{models[k]=sample(models[k].length);invalidate();renderInput(k)};$(k+'apply').onclick=()=>{const text=$(k+'paste').value.trim();const rows=text.split(/\r?\n/).filter(s=>s.trim()).map(r=>r.trim().split(/[\s,，、;]+/).map(v=>/^[+-]?\d+$/.test(v)?Number(v):NaN));const n=rows.length;if(!n||n===2||n>12||rows.some(r=>r.length!==n||r.some(v=>!Number.isSafeInteger(v)))){$(k+'error').textContent='1次または3〜12次の正方形になるよう、整数を空白・タブ・カンマで区切って入力してください。';return}$(k+'error').textContent='';models[k]=rows.map(row=>row.map(v=>stored(k,v)));$(k+'size').value=n;editing[k]=false;invalidate();renderInput(k)};if(k==='B')$('Bzero').onchange=()=>{bZero=$('Bzero').checked;$('Bpaste').value='';$('Bpaste').placeholder=bZero?'7 0 5\n2 4 6\n3 8 1':'8 1 6\n3 5 7\n4 9 2';$('Berror').textContent='';renderInput('B')};renderInput(k)}
function combine(a,b){const n=a.length,m=b.length;return Array.from({length:n*m},(_,r)=>Array.from({length:n*m},(_,c)=>a[r%n][c%n]+n*n*(b[Math.floor(r/n)][Math.floor(c/n)]-1)))}
function renderOutput(){if(!C)return;const n=snapshot.A.length,N=C.length,stats=check(C),sums=$('showSums').checked;const table=document.createElement('table');table.setAttribute('aria-label','合成した魔方陣C');table.style.setProperty('--cell',$('zoom').value+'px');table.style.setProperty('--font',Number($('zoom').value)<38?'12px':'15px');C.forEach((row,r)=>{const tr=table.insertRow();row.forEach((v,c)=>{const td=tr.insertCell();td.dataset.r=r;td.dataset.c=c;td.className=[r%n===0?'bt':'',c%n===0?'bl':'',r===N-1?'bb':'',c===N-1?'br':''].join(' ');const btn=document.createElement('button');btn.textContent=v;btn.setAttribute('aria-label',`C ${r+1}行${c+1}列: ${v}`);btn.onclick=()=>{const a=[r%n,c%n],b=[Math.floor(r/n),Math.floor(c/n)];if(equal(selectedA,a)&&equal(selectedB,b)){selectedA=null;selectedB=null}else{selectedA=a;selectedB=b}highlight()};td.append(btn)});if(sums){const td=tr.insertCell();td.className='sum';td.textContent=stats.rows[r]}});if(sums){const tr=table.insertRow();stats.cols.forEach(v=>{const td=tr.insertCell();td.className='sum';td.textContent=v})}$('output').replaceChildren(table);$('resultStatus').textContent=`✓ 1〜${N*N}が1回ずつ登場 · 各行・各列の和 ${stats.target} · 対角線 ↘ ${stats.diag[0]} ／ ↙ ${stats.diag[1]}`;highlight()}
function highlight(){for(const k of ['A','B']){const selected=k==='A'?selectedA:selectedB;document.querySelectorAll('#'+k+'table td').forEach(td=>{const hit=equal(selected,[Number(td.dataset.i),Number(td.dataset.j)]);td.classList.toggle('sel'+k,hit);const btn=td.querySelector('button');if(btn)btn.setAttribute('aria-pressed',String(hit))})}if(!C)return;const n=snapshot.A.length;document.querySelectorAll('#output td[data-r]').forEach(td=>{const r=Number(td.dataset.r),c=Number(td.dataset.c);const a=equal(selectedA,[r%n,c%n]),b=equal(selectedB,[Math.floor(r/n),Math.floor(c/n)]);td.classList.toggle('selA',a);td.classList.toggle('selB',b);td.classList.toggle('both',a&&b);td.querySelector('button').setAttribute('aria-pressed',String(a&&b))});if(selectedA&&selectedB){const [i,j]=selectedA,[u,v]=selectedB;const a=snapshot.A[i][j],b=snapshot.B[u][v];$('calculation').textContent=`A［${i+1},${j+1}］＋ ${n}² × ${bZero?`B［${u+1},${v+1}］`:`（B［${u+1},${v+1}］− 1）`}＝ ${a+n*n*(b-1)}\nA[${i+1},${j+1}]=${a}, B[${u+1},${v+1}]=${shown('B',b)}`}else if(selectedA){$('calculation').textContent=`Aの選択位置が、Cの各ブロックに計 ${snapshot.B.length**2} マス現れます。Bも選ぶと、交わる1マスを確認できます。`}else if(selectedB){$('calculation').textContent=`Bの値 ${shown('B',snapshot.B[selectedB[0]][selectedB[1]])} に対応する ${n} × ${n} のブロックを選択しています。`}else $('calculation').textContent='A・B・Cのマスを選択してください。'}
$('generate').onclick=()=>{if(!check(models.A).ok||!check(models.B).ok){$('message').textContent='A・Bの両方を魔方陣にしてから、組み合わせてください。';return}$('message').textContent='';for(const k of ['A','B'])editing[k]=false;snapshot={A:models.A.map(r=>r.slice()),B:models.B.map(r=>r.slice())};C=combine(snapshot.A,snapshot.B);selectedA=null;selectedB=null;renderInput('A');renderInput('B');$('result').hidden=false;$('resultSize').textContent=`${snapshot.A.length} × ${snapshot.B.length} ＝ ${C.length}次`;renderOutput()};
$('clear').onclick=()=>{selectedA=null;selectedB=null;highlight()};$('showSums').onchange=renderOutput;$('zoom').oninput=()=>{const table=$('output').querySelector('table');if(table){table.style.setProperty('--cell',$('zoom').value+'px');table.style.setProperty('--font',Number($('zoom').value)<38?'12px':'15px')}};
$('copy').onclick=async()=>{if(!C)return;const text=C.map(r=>r.join('\t')).join('\n');try{await navigator.clipboard.writeText(text);$('exportStatus').textContent='コピーしました。表計算ソフトなどに貼り付けられます。'}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.top='0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();$('exportStatus').textContent=ok?'コピーしました。':'コピーできませんでした。CSVをご利用ください。'}};
$('csv').onclick=()=>{if(!C)return;const blob=new Blob(['\uFEFF'+C.map(r=>r.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`magic-square-${C.length}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('generate').click();
</script></body></html>
