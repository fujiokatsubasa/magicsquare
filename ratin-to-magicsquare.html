<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔方陣を組み合わせる - 2</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#243641;background:#f5f7f6}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:32px 20px 60px}h1{font-size:clamp(24px,4vw,36px);margin:0 0 28px}h2{font-size:21px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #dce4e0;border-radius:16px;padding:22px;min-width:0}.head,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.head{justify-content:space-between}.controls{margin:16px 0}button,select,input,textarea{font:inherit}button,select{padding:8px 12px;border:1px solid #c5d2cc;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#eef4f1}:focus-visible{outline:3px solid #347fa5;outline-offset:2px}.scroll{overflow:auto;padding:4px;margin-top:16px}table{border-collapse:collapse;margin:auto;font-variant-numeric:tabular-nums}td{border:1px solid #c8d2ce;padding:0;text-align:center}td .cell{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border:0;border-radius:0;background:transparent;text-align:center;padding:0;color:inherit}td.sum{font-size:12px;color:#62736a;border:0;padding:8px;white-space:nowrap}.note,.status{font-size:14px;line-height:1.8;color:#62737a}.status{white-space:pre-line}.good{color:#27644a}.bad{color:#ad3c37}.result{margin-top:22px}textarea{display:block;width:100%;min-height:100px;margin:12px 0;border:1px solid #c5d2cc;border-radius:8px;padding:10px}summary{cursor:pointer;font-size:14px;color:#51685c}footer{font-size:12px;color:#738078;margin-top:20px}@media(max-width:700px){main{padding:24px 12px}.grid{grid-template-columns:1fr}.card{padding:16px}}
.base-toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.base-toggle input{position:absolute;opacity:0;width:1px;height:1px}.switch-track{display:inline-block;position:relative;width:46px;height:26px;border-radius:20px;background:#708078}.switch-track::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:white;transition:transform .15s}.base-toggle input:checked+.switch-track{background:#236b57}.base-toggle input:checked+.switch-track::after{transform:translateX(20px)}.base-toggle input:focus-visible+.switch-track{outline:3px solid #347fa5;outline-offset:3px}#C td .cell{width:auto;min-width:48px;padding:0 7px;white-space:nowrap}.shift-label{border:0;background:transparent!important;box-shadow:none!important;color:#62737a;font-size:12px;white-space:nowrap;padding:0 10px}.base-toggle+.base-toggle{margin-left:28px}@media(max-width:700px){.base-toggle+.base-toggle{margin-left:16px}}</style><main><h1>魔方陣を組み合わせる - 2</h1><div class="grid"><section class="card"><div class="head"><h2>ラテン方陣 A</h2><label>次数 <input id="size" aria-label="次数" type="number" min="3" step="1" value="5" style="width:90px"></label></div><div class="controls"><button id="aleft">← 左シフト</button><button id="aright">右シフト →</button></div><p class="note" id="ashiftNote"></p><div class="scroll" id="A"></div><p id="astatus" class="status"></p><details><summary>数字を貼り付ける</summary><textarea id="paste" aria-label="Aの貼り付け" placeholder="0 1 2 3 4&#10;1 2 3 4 0&#10;2 3 4 0 1&#10;3 4 0 1 2&#10;4 0 1 2 3"></textarea><button id="apply">貼り付けを反映</button><p class="status bad" id="error" role="alert"></p></details></section><section class="card"><h2>ラテン方陣B</h2><div class="controls"><button id="bleft">← 左シフト</button><button id="bright">右シフト →</button></div><p class="note" id="bshiftNote"></p><div class="scroll" id="B"></div><p id="bstatus" class="status"></p></section></div><section class="card result"><div class="head"><h2>魔方陣C <small id="order"></small></h2></div><p class="note" id="formula">C = nA ＋ B（0始まり）· 斜めの和は参考表示です。</p><div class="controls"><label><input type="checkbox" id="sums" checked> 行・列の和を表示</label><label class="base-toggle"><span>0始まり</span><input type="checkbox" role="switch" id="oneBased" aria-label="Cを1始まりにする"><span class="switch-track" aria-hidden="true"></span><span>1始まり</span></label><label class="base-toggle"><span>通常表示</span><input type="checkbox" role="switch" id="radix" aria-label="Cをn進法で表示"><span class="switch-track" aria-hidden="true"></span><span>n進法</span></label><button id="copy">数字をコピー</button><button id="csv">CSVをダウンロード</button></div><p class="note" id="radixNote"></p><div class="scroll" id="C"></div><p id="cstatus" class="status"></p><p id="export" class="status" role="status"></p></section><footer>入力した内容は、このブラウザ内で処理されます。</footer></main><script>
'use strict';
const $=id=>document.getElementById(id);
let A=example(5),B,C,aStep=1,bStep=2;
const sum=a=>a.reduce((s,v)=>s+v,0);
function example(n){return Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>(c+r)%n))}
function latin(a){const n=a.length;return a.flat().every(v=>Number.isInteger(v)&&v>=0&&v<n)&&a.every(r=>new Set(r).size===n)&&a.every((_,c)=>new Set(a.map(r=>r[c])).size===n)}
function stats(a){const n=a.length;return{rows:a.map(sum),cols:a.map((_,c)=>sum(a.map(r=>r[c]))),diags:[sum(a.map((r,i)=>r[i])),sum(a.map((r,i)=>r[n-1-i]))]}}
function offset(){return $('oneBased').checked?1:0}
function derive(){const n=A.length;B=A.map((row,i)=>row.map((_,j)=>row[((j+(bStep-aStep)*i)%n+n)%n]));C=A.map((row,i)=>row.map((v,j)=>v===null||B[i][j]===null?null:n*v+B[i][j]+offset()));}
function baseText(v,n){if(!Number.isSafeInteger(v))return Number.isFinite(v)?String(v):'—';const neg=v<0;let x=Math.abs(v),digits=[];do{digits.unshift(x%n);x=Math.floor(x/n)}while(x);while(digits.length<2)digits.unshift(0);return (neg?'-':'')+(n<=36?digits.map(d=>d.toString(36).toUpperCase()).join(''):'['+digits.join(',')+']')}
function cellText(v){return $('radix').checked?baseText(v,A.length):Number.isFinite(v)?String(v):'—'}
function gray(v,n){const h=Math.round(255-136*v/(n-1)).toString(16).padStart(2,'0');return '#'+h.repeat(3)}
function table(k){const a={A,B,C}[k],n=a.length,t=document.createElement('table');t.setAttribute('aria-label',k);a.forEach((row,i)=>{const tr=t.insertRow();const step=k==='A'?aStep:bStep;if(k!=='C'&&step>=0){const side=tr.insertCell();side.className='shift-label';side.textContent=i?`${step*i}マス ←`:''}row.forEach((v,j)=>{const td=tr.insertCell(),el=document.createElement('span');el.className='cell';if(k!=='C'&&Number.isInteger(v)&&v>=0&&v<n){td.style.backgroundColor=gray(v,n);td.style.color='#000000'}el.textContent=k==='C'?cellText(v):Number.isFinite(v)?v:'—';el.setAttribute('aria-label',`${k}[${i+1},${j+1}]`);td.append(el)});if(k!=='C'&&step<0){const side=tr.insertCell();side.className='shift-label';side.textContent=i?`→ ${-step*i}マス`:''}if(k==='C'&&$('sums').checked){const td=tr.insertCell();td.className='sum';td.textContent=row.every(Number.isFinite)?sum(row):'—'}});if(k==='C'&&$('sums').checked){const tr=t.insertRow();stats(a).cols.forEach((v,j)=>{const td=tr.insertCell();td.className='sum';td.textContent=a.every(r=>Number.isFinite(r[j]))?v:'—'})}$(k).replaceChildren(t)}
function status(){const n=A.length,valid=latin(A);$('astatus').textContent=valid?`✓ 各行・各列に0〜${n-1}が1回ずつ現れます。`:'ラテン方陣ではありません';$('astatus').className='status '+(valid?'good':'bad');const bvalid=latin(B);$('bstatus').textContent=bvalid?`✓ 各行・各列に0〜${n-1}が1回ずつ現れます。`:'ラテン方陣ではありません';$('bstatus').className='status '+(bvalid?'good':'bad');$('ashiftNote').textContent='1行目は固定し、2行目以降は上の行をシフトします。';$('bshiftNote').textContent='1行目は固定し、2行目以降は上の行をシフトします。'; $('order').textContent=`${n}次`;$('formula').textContent=`C = nA ＋ B${offset()?' ＋ 1（1始まり）':'（0始まり）'} · 斜めの和は参考表示です。`;$('radixNote').textContent=$('radix').checked?`${n}進法表示（最低2桁）。${offset()?'1を足した値を表示します。最大値は100になります。':'上位桁がA、下位桁がBです。'}${n>36?'各桁をカンマで区切り、角括弧で囲みます。':n>10?'10以上の桁はA、B、C…で表示します。':''} 和・コピー・CSVは10進法です。`:'';const complete=C.flat().every(Number.isFinite);if(!complete){$('cstatus').textContent='Aに整数を入力してください。';$('cstatus').className='status bad';return}const s=stats(C),target=n*(n*n-1)/2+n*offset(),unique=new Set(C.flat()).size,normal=C.flat().every(v=>Number.isInteger(v)&&v>=offset()&&v<n*n+offset())&&unique===n*n,magic=normal&&[...s.rows,...s.cols].every(v=>v===target);$('cstatus').textContent=`${normal?'✓':'×'} ${offset()}〜${n*n-1+offset()}が1回ずつ登場（異なる数は${unique}個）\n各行の和：${s.rows.join('、')}\n各列の和：${s.cols.join('、')}（目標 ${target}）\n対角線の和（参考）：↘ ${s.diags[0]} ／ ↙ ${s.diags[1]}\n${magic?'✓ 数字の重複がなく、各行・各列の和がそろっています。':'数字の重複、または行・列の和を確認してください。'}`;$('cstatus').className='status '+(magic?'good':'bad')}
function render(){derive();for(const k of ['A','B','C'])table(k);status()}
$('size').onchange=()=>{const n=Number($('size').value);if(!Number.isSafeInteger(n)||n<3){$('size').setCustomValidity('3以上の整数を入力してください。');$('size').reportValidity();return}$('size').setCustomValidity('');A=example(n);aStep=1;bStep=2;render()};
$('oneBased').onchange=()=>{render();$('export').textContent=''};
$('radix').onchange=()=>{table('C');status()};
function moveA(direction){const n=A.length;A=A.map((row,i)=>row.map((_,j)=>row[((j+direction*i)%n+n)%n]));aStep+=direction;render()}
$('aleft').onclick=()=>moveA(1);$('aright').onclick=()=>moveA(-1);
$('bleft').onclick=()=>{bStep++;render()};$('bright').onclick=()=>{bStep--;render()};
$('sums').onchange=()=>{table('C')};$('apply').onclick=()=>{const a=$('paste').value.trim().split(/\r?\n/).filter(r=>r.trim()).map(r=>r.trim().split(/[\s,，、;]+/).map(v=>/^[+-]?\d+$/.test(v)?Number(v):NaN));const n=a.length;if(n<3||a.some(r=>r.length!==n||r.some(v=>!Number.isSafeInteger(v)))){$('error').textContent='3次以上の正方形になるよう、整数を空白・タブ・カンマで区切って入力してください。';return}A=a;$('size').value=n;$('error').textContent='';aStep=1;bStep=2;render()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(C.map(r=>r.map(v=>v??'').join('\t')).join('\n'));$('export').textContent='コピーしました。'}catch{$('export').textContent='コピーできませんでした。CSVをご利用ください。'}};
$('csv').onclick=()=>{const url=URL.createObjectURL(new Blob(['\uFEFF'+C.map(r=>r.map(v=>v??'').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`latin-composition-${A.length}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
